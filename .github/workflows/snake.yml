name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate and publish snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ImranGurmani
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23FACC15
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FACC15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
