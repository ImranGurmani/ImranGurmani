name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate dark and light contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ImranGurmani
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FACC15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs in output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh generated snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
